[project]
name = "pfa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "awconnect",
    "duckdb",
    "numpy",
    "pandas",
    "plotly",
    "pyarrow",
    "requests",
]

[project.scripts]
pfa = "pfa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pfa"]
