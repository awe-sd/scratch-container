[project]
name = "scratch-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.4",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["branch_tracking/tests"]
