[project]
name = "scratch-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "dash>=4.4.1",
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "netcdf4>=1.7.4",
    "networkx>=3.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pyarrow>=25.0.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "rasterio>=1.5.0",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
    "xarray>=2026.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["branch_tracking/tests", "powerflow_analytics/tests"]
