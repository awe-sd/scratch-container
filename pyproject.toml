[project]
name = "scratch-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "netcdf4>=1.7.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "rasterio>=1.5.0",
    "xarray>=2026.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["branch_tracking/tests"]
